# A chave anon do Supabase é pública por natureza (protegida por RLS).
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
